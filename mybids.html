<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bids - AuctionHouse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { background-color: #6a0dad; }
    .navbar a { color: white !important; font-weight: 600; margin: 0 10px; }
    .navbar a:hover { color: #d8b4fe !important; }
    .auction-font { font-family: 'Cinzel Decorative', serif; }
    .bid-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: all 0.3s; }
    .bid-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.15); transform: translateY(-5px); }
    .card-img-top { width: 100%; height: 250px; object-fit: cover; border-bottom: 3px solid #6a0dad; }
    .status-badge { position: absolute; top: 10px; right: 10px; padding: 5px 15px; border-radius: 20px; font-size: 0.85rem; }
    .status-pending { background: #ffc107; }
    .status-winning { background: #28a745; color: white; }
    .status-outbid { background: #dc3545; color: white; }
    .delete-btn { background: #dc3545; border: none; color: white; padding: 8px 20px; border-radius: 6px; transition: all 0.3s; }
    .delete-btn:hover { background: #c82333; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .total-section { background: linear-gradient(135deg, #6a0dad, #9b4dca); color: white; padding: 30px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
    .total-amount { font-size: 2.5rem; font-weight: bold; }
    footer { background-color: #6a0dad; color: white; text-align: center; padding: 15px; margin-top: auto; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container d-flex justify-content-between">
      <a href="index.html" class="navbar-brand"><span class="auction-font">AuctionHouse</span></a>
      <div>
        <a href="auctions.html">Auctions</a>
        <a href="mybids.html" class="active">My Bids <span id="bidCount" class="badge bg-light text-dark">0</span></a>
        <a href="about.html">About</a>
        <a href="help.html">Help</a>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="text-center mb-4" style="color: #6a0dad;">My Active Bids</h2>

    <div class="total-section" id="totalSection" style="display: none;">
      <p class="mb-1">Total Bid Amount</p>
      <div class="total-amount" id="totalAmount">$0</div>
      <p class="mb-0"><span id="totalItems">0</span> items</p>
    </div>

    <div class="row g-4" id="bidsContainer"></div>

    <div class="empty-state" id="emptyState">
      <h3>No Bids Yet</h3>
      <p>Visit our <a href="auctions.html" style="color: #6a0dad;">Auctions page</a> to start bidding!</p>
      <a href="auctions.html" class="btn btn-primary" style="background: #6a0dad; border: none;">Browse Auctions</a>
    </div>
  </div>

  <footer>&copy; 2025 AuctionHouse</footer>

  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5>Confirm Delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Remove this bid?</div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger" id="confirmDelete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let deleteId = null;

    function loadBids() {
      const bids = JSON.parse(localStorage.getItem('myBids') || '[]');
      const container = $('#bidsContainer');
      
      container.empty();
      
      if (bids.length === 0) {
        $('#emptyState').show();
        $('#totalSection').hide();
        return;
      }
      
      $('#emptyState').hide();
      $('#totalSection').show();

      let total = 0;
      bids.forEach(bid => total += bid.bid);
      
      $('#totalAmount').text('$' + total.toLocaleString());
      $('#totalItems').text(bids.length);
      $('#bidCount').text(bids.length);

      bids.forEach(bid => {
        const statusClass = `status-${bid.status.toLowerCase()}`;
        const date = new Date(bid.date).toLocaleDateString();
        
        container.append(`
          <div class="col-md-4">
            <div class="bid-card">
              <div style="position: relative;">
                <img src="${bid.image}" class="card-img-top" alt="${bid.item}">
                <span class="status-badge ${statusClass}">${bid.status}</span>
              </div>
              <div class="card-body text-center p-3">
                <h5>${bid.item}</h5>
                <p class="mb-1">Your Bid: <strong style="color: #6a0dad; font-size: 1.2rem;">$${bid.bid}</strong></p>
                <p class="text-muted mb-1" style="font-size: 0.9rem;">Starting: $${bid.currentPrice}</p>
                <p class="text-muted mb-3" style="font-size: 0.85rem;">${date}</p>
                <button class="delete-btn" data-id="${bid.id}">Remove Bid</button>
              </div>
            </div>
          </div>
        `);
      });

      $('.delete-btn').on('click', function() {
        deleteId = $(this).data('id');
        $('#deleteModal').modal('show');
      });
    }

    $(document).ready(function() {
      loadBids();

      $('#confirmDelete').on('click', function() {
        let bids = JSON.parse(localStorage.getItem('myBids') || '[]');
        bids = bids.filter(bid => bid.id !== deleteId);
        localStorage.setItem('myBids', JSON.stringify(bids));
        $('#deleteModal').modal('hide');
        $('#bidsContainer').fadeOut(200, function() {
          loadBids();
          $(this).fadeIn(200);
        });
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
