
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuctionHouse - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #6a0dad;
    }
    .navbar a {
      color: white !important;
      font-weight: 600;
      margin: 0 10px;
      transition: color 0.3s;
    }
    .navbar a:hover {
      color: #d8b4fe !important;
    }
    .auction-font {
      font-family: 'Cinzel Decorative', serif;
      letter-spacing: 1px;
    }
    .intro-section {
      background: linear-gradient(135deg, #6a0dad, #9b4dca);
      color: white;
      padding: 80px 20px;
      text-align: center;
    }
    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .grid-item {
      position: relative;
      height: 280px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .grid-item:hover img {
      transform: scale(1.1);
    }
    .grid-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(106, 13, 173, 0.9);
      color: white;
      padding: 15px;
      transform: translateY(100%);
      transition: transform 0.3s;
    }
    .grid-item:hover .grid-overlay {
      transform: translateY(0);
    }
    footer {
      background-color: #6a0dad;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container d-flex justify-content-between">
      <a href="index.html" class="navbar-brand"><span class="auction-font">AuctionHouse</span></a>
      <div>
        <a href="auctions.html">Auctions</a>
        <a href="mybids.html">My Bids <span id="bidCount" class="badge bg-light text-dark">0</span></a>
        <a href="about.html">About</a>
        <a href="help.html">Help</a>
      </div>
    </div>
  </nav>

  <section class="intro-section">
    <h1>Welcome to AuctionHouse</h1>
    <p>Discover rare art, collectibles, and exclusive items.</p>
  </section>

  <div class="container">
    <h2 class="text-center mt-5 mb-4" style="color: #6a0dad;">Featured Items</h2>
    <div class="images-grid">
      <div class="grid-item">
        <a href="auctions.html">
          <img src="images/labubu.jpg" alt="Labubu">
          <div class="grid-overlay">
            <h5>Labubu Figure</h5>
            <p>Starting at $300</p>
          </div>
        </a>
      </div>
      <div class="grid-item">
        <a href="auctions.html">
          <img src="images/gpoke.jpg" alt="Pokemon">
          <div class="grid-overlay">
            <h5>Golden Pokémon Card</h5>
            <p>Starting at $1200</p>
          </div>
        </a>
      </div>
      <div class="grid-item">
        <a href="auctions.html">
          <img src="images/ra.jpg" alt="Ronaldo">
          <div class="grid-overlay">
            <h5>Ronaldo Autograph</h5>
            <p>Starting at $5000</p>
          </div>
        </a>
      </div>
      <div class="grid-item">
        <a href="auctions.html">
          <img src="images/sk.jpg" alt="Sneakers">
          <div class="grid-overlay">
            <h5>Rare Sneakers</h5>
            <p>Starting at $450</p>
          </div>
        </a>
      </div>
    </div>
  </div>

  <footer>© 2025 AuctionHouse</footer>

  <script>
    function updateBidCount() {
      const bids = JSON.parse(localStorage.getItem('myBids') || '[]');
      $('#bidCount').text(bids.length);
    }
    
    $(document).ready(function() {
      updateBidCount();
      $('.intro-section h1').hide().fadeIn(1000);
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
